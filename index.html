<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關於我</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --card-bg: rgba(20, 20, 20, 0.35);
      --card-border: rgba(255, 255, 255, 0.35);
      --text: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Noto Sans TC", system-ui, sans-serif;
      color: var(--text);
      background-color: #111111;
      background: linear-gradient(135deg, #111111, #f2f2f2, #6b6b6b, #7b2cbf, #d00000, #111111);
      background-size: 400% 400%;
      animation: gradientShift 14s ease infinite;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 48px 36px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      animation: fadeUp 0.8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 44px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff55, #ffffff22);
      border: 3px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--text-soft);
      font-size: 0.95rem;
    }

    .section-title {
      margin: 32px 0 14px;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      color: var(--text-soft);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      list-style: none;
    }

    .tags li {
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.4);
      font-size: 0.95rem;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .tags li:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.35);
    }

    blockquote {
      margin-top: 32px;
      padding: 20px 24px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.12);
      font-size: 1.05rem;
      line-height: 1.7;
      position: relative;
    }

    blockquote::before {
      content: "“";
      position: absolute;
      top: -18px;
      left: 16px;
      font-size: 3.5rem;
      line-height: 1;
      opacity: 0.6;
    }

    @media (max-width: 420px) {
      .card { padding: 36px 22px; }
      h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">L</div>
    <h1>Leila</h1>
    <p class="subtitle">喜歡探索世界的旅人</p>

    <h2 class="section-title">我的興趣</h2>
    <ul class="tags">
      <li>✈️ 旅遊</li>
    </ul>

    <blockquote>
      Be modest, be humble.
    </blockquote>
  </main>
</body>
</html>
